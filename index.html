<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CoreSync Studio v3.0 by BrainRex</title>
    <style>
        /* Liquid Glass Dynamic Design Tokens */
        :root {
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            /* Fluid Theme-Aware Variables - Defaulting to Dark Mode Glass */
            --liquid-mesh: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #311042 70%, #020617 100%);
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-bg-hover: rgba(51, 65, 85, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-focus: rgba(56, 189, 248, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: rgba(239, 68, 68, 0.85);
            --danger-hover: #dc2626;
            --panel-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        /* Light Mode Liquid Glass Adaptive Overrides */
        @media (prefers-color-scheme: light) {
            :root {
                --liquid-mesh: linear-gradient(135deg, #f0f4f8 0%, #e0e7ff 40%, #fae8ff 70%, #f1f5f9 100%);
                --glass-bg: rgba(255, 255, 255, 0.45);
                --glass-bg-hover: rgba(255, 255, 255, 0.65);
                --glass-border: rgba(0, 0, 0, 0.06);
                --glass-border-focus: rgba(14, 165, 233, 0.5);
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --accent-primary: #0ea5e9;
                --accent-hover: #0284c7;
                --danger: rgba(239, 68, 68, 0.9);
                --panel-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
                --input-bg: rgba(255, 255, 255, 0.7);
            }
        }

        body { 
            font-family: var(--font-family); 
            background: var(--liquid-mesh);
            background-attachment: fixed;
            color: var(--text-primary); 
            padding: 30px; 
            margin: 0; 
            box-sizing: border-box;
            min-height: 100vh;
            transition: var(--transition);
        }
        
        .studio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .studio-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .studio-title h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.75px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .studio-subtitle {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .version-badge {
            background: var(--accent-primary);
            color: #fff;
            padding: 4px 10px;
            font-weight: 700;
            font-size: 11px;
            border-radius: 30px;
            letter-spacing: 0px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        /* Glassmorphism Structural Cards */
        .pipeline-status-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            box-shadow: var(--panel-shadow);
            transition: var(--transition);
        }

        .panel-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 180px;
        }

        .form-group-thumb {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
        }

        .form-group-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: flex-end;
            padding-top: 14px;
            border-top: 1px solid var(--glass-border);
            margin-top: 10px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            color: var(--text-secondary);
        }

        input[type="text"], input[type="password"], input[type="file"], input[type="number"], select { 
            background: var(--input-bg); 
            color: var(--text-primary); 
            border: 1px solid var(--glass-border); 
            padding: 8px 14px; 
            box-sizing: border-box; 
            font-family: var(--font-family);
            border-radius: var(--radius-md);
            font-size: 13px;
            height: 42px;
            transition: var(--transition);
        }

        input:focus, select:focus { 
            border-color: var(--glass-border-focus); 
            box-shadow: 0 0 0 3px var(--glass-border-focus);
            outline: none; 
        }

        button { 
            font-family: var(--font-family);
            padding: 0 24px; 
            height: 42px;
            font-weight: 700; 
            cursor: pointer; 
            border: none; 
            border-radius: var(--radius-md);
            font-size: 13px;
            transition: var(--transition);
        }

        .btn-initialize { 
            background: var(--accent-primary); 
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }
        .btn-initialize:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
        
        .btn-shutdown { 
            background: var(--danger); 
            color: #ffffff; 
        }
        .btn-shutdown:hover:not(:disabled) { transform: translateY(-1px); }

        button:disabled {
            background: rgba(0, 0, 0, 0.1) !important;
            color: var(--text-secondary) !important;
            border: 1px solid var(--glass-border) !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            letter-spacing: 0.5px;
        }
        .status-pill.idle { color: var(--text-secondary); }
        .status-pill.live { 
            color: #ff4757; 
            border-color: rgba(255, 71, 87, 0.3);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.2);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .asset-preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            width: 42px;
            height: 42px;
            overflow: hidden;
        }
        .impact-thumbnail { width: 100%; height: 100%; object-fit: cover; display: none; }
        .thumbnail-placeholder { font-size: 10px; color: var(--text-secondary); font-weight: 600; }

        .grid { display: flex; gap: 24px; margin-bottom: 24px; }
        .box { 
            background: var(--glass-bg); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 20px; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--glass-border); 
            width: 50%; 
            position: relative;
            box-shadow: var(--panel-shadow);
        }
        .box h3 { margin: 0 0 14px 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: var(--radius-md);
            width: 100%;
            aspect-ratio: 16/9; 
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .fullscreen-trigger {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 14px;
            height: auto;
            font-size: 11px;
            font-weight: 600;
            border-radius: 30px;
            z-index: 10;
        }
        .fullscreen-trigger:hover:not(:disabled) { background: var(--accent-primary); }

        .collapsible-console-wrapper {
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--panel-shadow);
        }
        .console-header {
            padding: 14px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .console-content { display: none; padding: 20px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid var(--glass-border); }
        .console { height: 140px; overflow-y: auto; font-size: 12px; font-family: ui-monospace, monospace; color: var(--text-secondary); line-height: 1.6; }

        /* 🖥️ PC Native Fullscreen Layout */
        .hud-fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 99999;
        }
        .hud-layout { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .hud-main-output { width: 100%; height: 100%; background: #000; }
        .hud-main-output video { width: 100%; height: 100%; object-fit: contain; }

        /* Responsive HUD Overlay Parameters */
        .hud-watermark-timer {
            position: absolute;
            bottom: clamp(20px, 5vh, 40px);
            left: clamp(20px, 5vw, 40px);
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: clamp(6px, 1.5vh, 12px) clamp(12px, 2vw, 24px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100000;
        }
        .hud-watermark-label { font-size: clamp(9px, 1vh, 11px); font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .hud-watermark-value { font-size: clamp(16px, 2.5vh, 24px); font-weight: 800; color: #ffffff; font-family: ui-monospace, monospace; }

        .hud-floating-actions {
            position: absolute;
            bottom: clamp(20px, 5vh, 40px);
            right: clamp(20px, 5vw, 40px);
            display: flex;
            gap: 12px;
            z-index: 100000;
        }
        .hud-btn-action { height: clamp(36px, 4.5vh, 46px); padding: 0 clamp(16px, 2vw, 24px); border-radius: 30px; font-weight: 700; font-size: clamp(11px, 1.5vh, 13px); }
        .hud-btn-close { background: rgba(255, 255, 255, 0.15); color: #ffffff; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .hud-btn-close:hover { background: rgba(255, 255, 255, 0.25); }
        .hud-btn-stop-floating { background: #ef4444; color: #ffffff; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4); }

        /* 📱 Android Layout Optimization Rules */
        @media (max-width: 768px) {
            body { padding: 16px; }
            .studio-header { flex-direction: column; align-items: flex-start; gap: 14px; }
            .header-controls { text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center; }
            .panel-grid { flex-direction: column; align-items: stretch; gap: 16px; }
            .form-group { min-width: 100%; }
            .grid { flex-direction: column; gap: 16px; }
            .box { width: 100%; box-sizing: border-box; }
            .video-container { aspect-ratio: 11/14; }
            .hud-main-output video { object-fit: cover; }
            
            /* Responsive UI Anti-Collision stacking rules */
            .hud-watermark-timer {
                bottom: calc(10px + env(safe-area-inset-bottom));
                left: 16px;
                padding: 6px 14px;
            }
            .hud-floating-actions {
                bottom: calc(10px + env(safe-area-inset-bottom));
                right: 16px;
            }
            .hud-btn-action {
                height: 36px;
                padding: 0 14px;
            }
        }
    </style>
    
    <script type="module">
        let sdkModuleLoaded = false;
        let createDecartClient, models;
        let client;
        let realtimeClient = null;
        let localStream = null;
        
        let countdownInterval = null;
        let currentTimeRemaining = 0; 
        const BURN_RATE = 2; 

        async function initApp() {
            try {
                const sdk = await import("https://esm.sh/@decartai/sdk");
                createDecartClient = sdk.createDecartClient;
                models = sdk.models;
                sdkModuleLoaded = true;
                console.log("[OK] Decart Core Module Framework compiled safely under v3.0 specs.");
            } catch (sdkError) {
                logToConsole("❌ SDK Error: Unable to fetch cloud stream wrappers.", true);
            }

            fetchHardware();
            calculateInitialTime();
            assessKeyStatus();
        }

        async function fetchHardware() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSelect = document.getElementById('cameraSelect');
                if (!camSelect) return;
                camSelect.innerHTML = '';
                
                let count = 1;
                devices.forEach(device => {
                    if (device.kind === 'videoinput') {
                        const opt = document.createElement('option');
                        opt.value = device.deviceId;
                        opt.text = device.label || `Camera ${count++}`;
                        camSelect.appendChild(opt);
                    }
                });
            } catch (err) {
                console.log("Hardware enumeration skipped.");
            }
        }

        function logToConsole(text, isError = false) {
            const consoleEl = document.getElementById('sysConsole');
            if(!consoleEl) return;
            const timestamp = new Date().toLocaleTimeString();
            let colorVar = isError ? "var(--danger)" : "var(--accent-primary)";
            consoleEl.innerHTML += `<div style="color: ${colorVar}; margin-bottom: 4px;">[${timestamp}] ${text}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function calculateInitialTime() {
            const creditInput = document.getElementById('creditInput');
            const credits = creditInput ? parseInt(creditInput.value) : 0;
            
            if (!isNaN(credits) && credits > 0) {
                currentTimeRemaining = Math.max(0, Math.floor(credits / BURN_RATE));
            } else {
                currentTimeRemaining = 0;
            }
            updateCountdownUI();
        }

        function initCountdownEngine() {
            clearInterval(countdownInterval);
            calculateInitialTime();

            countdownInterval = setInterval(() => {
                if (currentTimeRemaining <= 0) {
                    logToConsole("⚠️ Credits exhausted. Hard stop engaged.", true);
                    stopStream(); 
                    return;
                }
                currentTimeRemaining--;
                updateCountdownUI();
            }, 1000);
        }

        function updateCountdownUI() {
            const minutes = Math.floor(currentTimeRemaining / 60);
            const seconds = currentTimeRemaining % 60;
            const formatStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            const sessionCountdown = document.getElementById('sessionCountdown');
            const hudSessionCountdown = document.getElementById('hudSessionCountdown');
            
            if (sessionCountdown) sessionCountdown.innerText = formatStr;
            if (hudSessionCountdown) hudSessionCountdown.innerText = formatStr;
        }

        function assessKeyStatus() {
            const keyInput = document.getElementById('apiKey');
            const rawKey = keyInput ? keyInput.value.trim() : '';
            const fileInput = document.getElementById('photoUpload')?.files[0];
            const startBtn = document.getElementById('btnConnect');
            const fullscreenBtn = document.getElementById('launchFullscreen');

            if (realtimeClient) {
                if (startBtn) startBtn.disabled = true;
                if (fullscreenBtn) fullscreenBtn.disabled = false;
            } else {
                if (fullscreenBtn) fullscreenBtn.disabled = true;
                if (startBtn) startBtn.disabled = !(sdkModuleLoaded && rawKey.length > 0 && fileInput);
            }
        }

        async function startStream() {
            if (realtimeClient) {
                await realtimeClient.disconnect().catch(() => {});
                realtimeClient = null;
            }

            const rawKey = document.getElementById('apiKey')?.value.trim();
            const fileInput = document.getElementById('photoUpload')?.files[0];
            const camId = document.getElementById('cameraSelect')?.value || '';
            
            if (!rawKey || !fileInput) return;

            logToConsole(`Compiling session assets...`);
            document.getElementById('btnConnect').disabled = true;
            document.getElementById('btnStop').disabled = false;
            document.getElementById('hudBtnStop').disabled = false;

            try {
                client = createDecartClient({ apiKey: rawKey, baseUrl: "wss://api3.decart.ai" });
                const model = models.realtime("lucy-latest");

                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: camId ? { exact: camId } : undefined, width: 1280, height: 720 },
                        audio: false
                    });
                    document.getElementById('localVideo').srcObject = localStream;
                }

                const reader = new FileReader();
                reader.readAsArrayBuffer(fileInput);
                reader.onloadend = async () => {
                    const imageBlob = new Blob([reader.result], { type: fileInput.type });
                    
                    try {
                        realtimeClient = await client.realtime.connect(localStream, {
                            model: model,
                            initialState: { prompt: { text: "Transform into this character" }, image: imageBlob },
                            onRemoteStream: (transformedStream) => {
                                logToConsole("Pipeline loop linked! Streaming output...");
                                document.getElementById('remoteVideo').srcObject = transformedStream;
                                document.getElementById('hudRemoteVideo').srcObject = transformedStream;
                                
                                const systemPill = document.getElementById('systemPill');
                                if (systemPill) { systemPill.className = "status-pill live"; systemPill.innerText = "LIVE"; }
                                
                                initCountdownEngine();
                                assessKeyStatus();
                            },
                            onError: (err) => {
                                if (err && err.message) {
                                    logToConsole(`❌ Pipeline Context Exception: ${err.message}`, true);
                                }
                                stopStream();
                            }
                        });
                    } catch (connErr) {
                        logToConsole(`Stream handshake initialization pending or blocked: ${connErr.message}`, true);
                        stopStream();
                    }
                };
            } catch (error) {
                logToConsole(`Initialization Failed: ${error.message}`, true);
                stopStream();
            }
        }

        async function stopStream() {
            clearInterval(countdownInterval);
            countdownInterval = null;
            
            if (realtimeClient) {
                await realtimeClient.disconnect().catch(() => {});
                realtimeClient = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('hudRemoteVideo').srcObject = null;

            const systemPill = document.getElementById('systemPill');
            if (systemPill) { systemPill.className = "status-pill idle"; systemPill.innerText = "IDLE"; }

            document.getElementById('btnStop').disabled = true;
            document.getElementById('hudBtnStop').disabled = true;
            
            assessKeyStatus();
            logToConsole("Operational interfaces idling. Output monitors completely blanked out.");
        }

        function triggerHUDMode(activate) {
            const overlay = document.getElementById('hudOverlay');
            if (!overlay) return;
            if (activate) {
                overlay.style.display = "block";
                if (overlay.requestFullscreen) overlay.requestFullscreen().catch(() => {});
            } else {
                overlay.style.display = "none";
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnConnect')?.addEventListener('click', startStream);
            document.getElementById('btnStop')?.addEventListener('click', stopStream);
            document.getElementById('hudBtnStop')?.addEventListener('click', stopStream);
            
            // 🔑 Case-correction parser logic matching image_22.png validation rule parameters
            document.getElementById('apiKey')?.addEventListener('input', (e) => {
                let val = e.target.value;
                if (val.startsWith('D')) {
                    e.target.value = 'd' + val.slice(1);
                    console.log("[MUTATION ENGINE] Stream token normalized to lowercase 'd' prefix descriptor.");
                }
                assessKeyStatus();
            });

            document.getElementById('creditInput')?.addEventListener('input', () => {
                calculateInitialTime();
                assessKeyStatus();
            });
            
            document.getElementById('photoUpload')?.addEventListener('change', (event) => {
                const file = event.target.files[0];
                const mainThumb = document.getElementById('mainThumb');
                const placeholderText = document.getElementById('thumbPlaceholder');

                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        if (mainThumb) { mainThumb.src = e.target.result; mainThumb.style.display = 'block'; }
                        if (placeholderText) placeholderText.style.display = 'none';
                        assessKeyStatus();
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            document.getElementById('consoleHeader')?.addEventListener('click', () => {
                const content = document.getElementById('consoleContent');
                content.style.display = content.style.display === "block" ? "none" : "block";
            });

            document.getElementById('launchFullscreen')?.addEventListener('click', () => triggerHUDMode(true));
            document.getElementById('hudExitBtn')?.addEventListener('click', () => triggerHUDMode(false));
            
            initApp();
        });
    </script>
</head>
<body>

    <header class="studio-header">
        <div class="studio-title">
            <h2>CoreSync Studio <span class="version-badge">v3.0</span></h2>
            <span class="studio-subtitle">by Brain Moth3rfucking Rex</span>
        </div>
        <div class="header-controls">
            <div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="status-pill idle" id="systemPill">IDLE</span>
                    <span style="color:var(--text-secondary); font-weight: 600; font-size: 12px;">
                        LIMIT: <span id="sessionCountdown" style="color:var(--text-primary); font-family: ui-monospace, monospace;">0:00</span>
                    </span>
                </div>
            </div>
        </div>
    </header>
    
    <div class="pipeline-status-panel">
        <div class="panel-grid">
            <div class="form-group">
                <label>Stream Key</label>
                <input type="password" id="apiKey" placeholder="Enter Stream Key (dct_...)">
            </div>
            <div class="form-group">
                <label>Credits (Max 1000)</label>
                <input type="number" id="creditInput" placeholder="1000" min="0" max="1000" value="1000">
            </div>
            <div class="form-group hide-on-mobile">
                <label>Camera Hardware</label>
                <select id="cameraSelect">
                    <option value="">Detecting...</option>
                </select>
            </div>
            <div class="form-group hide-on-mobile">
                <label>Stream Quality</label>
                <select id="resSelect">
                    <option value="1280x720">720p (High)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Reference Asset</label>
                <input type="file" id="photoUpload" accept="image/*">
            </div>
            <div class="form-group-thumb">
                <label>Thumbnail</label>
                <div class="asset-preview-box">
                    <img id="mainThumb" class="impact-thumbnail" alt="Reference View">
                    <span id="thumbPlaceholder" class="thumbnail-placeholder">NONE</span>
                </div>
            </div>
            <div class="form-group-actions">
                <button id="btnConnect" class="btn-initialize" disabled>Start Session</button>
                <button id="btnStop" class="btn-shutdown" disabled>Stop</button>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="box">
            <h3>Input Camera</h3>
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
        </div>
        <div class="box">
            <h3>Live Output</h3>
            <button class="fullscreen-trigger" id="launchFullscreen" disabled>⛶ Fullscreen</button>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <div class="collapsible-console-wrapper">
        <div class="console-header" id="consoleHeader">
            <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase;">System Logs</span>
            <span style="font-size: 11px; font-weight:600; color:var(--text-secondary);">Toggle Output</span>
        </div>
        <div class="console-content" id="consoleContent">
            <div class="console" id="sysConsole">CoreSync system diagnostics initialized for production v3.0...</div>
        </div>
    </div>

    <!-- HUD Overlay Viewport Frame -->
    <div id="hudOverlay" class="hud-fullscreen-overlay">
        <div class="hud-layout">
            <div class="hud-main-output">
                <video id="hudRemoteVideo" autoplay playsinline></video>
            </div>
            
            <div class="hud-watermark-timer">
                <span class="hud-watermark-label">Time Remaining</span>
                <span class="hud-watermark-value" id="hudSessionCountdown">0:00</span>
            </div>

            <div class="hud-floating-actions">
                <button id="hudBtnStop" class="hud-btn-action hud-btn-stop-floating" disabled>Stop Stream</button>
                <button id="hudExitBtn" class="hud-btn-action hud-btn-close">✕ Close HUD</button>
            </div>
        </div>
    </div>

</body>
</html>
