<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CoreSync Studio v3.4</title>
    <style>
        :root {
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --liquid-mesh: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #311042 70%, #020617 100%);
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-bg-hover: rgba(51, 65, 85, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-focus: rgba(56, 189, 248, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: rgba(239, 68, 68, 0.85);
            --danger-hover: #dc2626;
            --panel-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --liquid-mesh: linear-gradient(135deg, #f0f4f8 0%, #e0e7ff 40%, #fae8ff 70%, #f1f5f9 100%);
                --glass-bg: rgba(255, 255, 255, 0.45);
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --accent-primary: #0ea5e9;
                --danger: rgba(239, 68, 68, 0.9);
                --panel-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
                --input-bg: rgba(255, 255, 255, 0.7);
            }
        }

        body { font-family: var(--font-family); background: var(--liquid-mesh); background-attachment: fixed; color: var(--text-primary); padding: 30px; margin: 0; box-sizing: border-box; min-height: 100vh; transition: var(--transition); }
        
        .studio-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--glass-border); }
        .studio-title { display: flex; flex-direction: column; gap: 4px; }
        .studio-title h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.75px; }
        .version-badge { background: var(--accent-primary); color: #fff; padding: 4px 10px; font-weight: 700; font-size: 11px; border-radius: 30px; }

        .pipeline-status-panel { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); padding: 24px; border-radius: var(--radius-lg); margin-bottom: 24px; box-shadow: var(--panel-shadow); }
        .panel-grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 180px; }
        .form-group-actions { flex: 0 0 auto; display: flex; gap: 12px; padding-top: 14px; border-top: 1px solid var(--glass-border); margin-top: 10px; }
        label { font-size: 11px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; color: var(--text-secondary); }
        
        input, select { background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--glass-border); padding: 8px 14px; border-radius: var(--radius-md); height: 42px; }
        button { font-family: var(--font-family); padding: 0 24px; height: 42px; font-weight: 700; cursor: pointer; border: none; border-radius: var(--radius-md); }
        .btn-initialize { background: var(--accent-primary); color: #ffffff; }
        .btn-shutdown { background: var(--danger); color: #ffffff; }

        .status-pill { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--glass-border); font-size: 11px; font-weight: 700; }
        .status-pill.live { color: #ff4757; border-color: rgba(255, 71, 87, 0.3); }

        .video-container { position: relative; background: #000; border-radius: var(--radius-md); width: 100%; aspect-ratio: 16/9; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .fullscreen-trigger { position: absolute; top: 16px; right: 16px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 6px 14px; border-radius: 30px; z-index: 10; }

        .hud-fullscreen-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 99999; }
        .hud-layout { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .hud-main-output video { width: 100%; height: 100%; object-fit: contain; }

        .hud-watermark-timer { position: absolute; bottom: clamp(10px, 2vh, 15px); left: clamp(20px, 5vw, 40px); background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); padding: 8px 20px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.12); z-index: 100000; }
        .hud-floating-actions { position: absolute; bottom: clamp(10px, 2vh, 15px); right: clamp(20px, 5vw, 40px); display: flex; gap: 12px; z-index: 100000; }
        .hud-btn-action { height: 40px; padding: 0 20px; border-radius: 30px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .hud-btn-stop-floating { background: #ef4444; color: #fff; }
        .hud-btn-close { background: rgba(255, 255, 255, 0.15); color: #fff; }

        @media (max-width: 768px) { .hide-on-mobile-tablet { display: none !important; } }
    </style>
    
    <script type="module">
        let createDecartClient, models, client, realtimeClient = null, localStream = null;
        let countdownInterval = null, currentTimeRemaining = 0, BURN_RATE = 2;

        async function initApp() {
            try {
                const sdk = await import("https://esm.sh/@decartai/sdk");
                createDecartClient = sdk.createDecartClient;
                models = sdk.models;
            } catch (e) { console.error("SDK Load Fail"); }
            checkDeviceType();
        }

        function checkDeviceType() {
            const isMobile = /Mobi|Tablet|Android|Silk|iPad|iPhone|iPod/i.test(navigator.userAgent);
            if (isMobile) {
                document.querySelectorAll('.hide-on-mobile-tablet').forEach(el => el.style.display = 'none');
            } else {
                fetchHardware();
            }
        }

        async function fetchHardware() {
            const camSelect = document.getElementById('cameraSelect');
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(t => t.stop());
                const devices = await navigator.mediaDevices.enumerateDevices();
                camSelect.innerHTML = '';
                let count = 1;
                devices.forEach(d => {
                    if (d.kind === 'videoinput') {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.text = d.label || `Camera ${count++}`;
                        camSelect.appendChild(opt);
                    }
                });
            } catch (e) { console.log("Hardware access skipped"); }
        }

        async function stopStream() {
            clearInterval(countdownInterval);
            if (realtimeClient) { await realtimeClient.disconnect().catch(() => {}); realtimeClient = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }

            const videos = ['localVideo', 'remoteVideo', 'hudRemoteVideo'];
            videos.forEach(id => {
                const el = document.getElementById(id);
                el.srcObject = null;
                el.load(); // Forces flush of cached frames
            });

            document.getElementById('systemPill').className = "status-pill idle";
            document.getElementById('systemPill').innerText = "IDLE";
        }

        function triggerHUDMode(activate) {
            document.getElementById('hudOverlay').style.display = activate ? "block" : "none";
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnConnect').addEventListener('click', async () => {
                // ... (existing connection logic remains same)
            });
            document.getElementById('btnStop').addEventListener('click', stopStream);
            document.getElementById('hudBtnStop').addEventListener('click', stopStream);
            document.getElementById('launchFullscreen').addEventListener('click', () => triggerHUDMode(true));
            document.getElementById('hudExitBtn').addEventListener('click', () => triggerHUDMode(false));
            initApp();
        });
    </script>
</head>
<body>
    <header class="studio-header">
        <div class="studio-title">
            <h2>CoreSync Studio <span class="version-badge">v3.4</span></h2>
        </div>
    </header>
    
    <div class="pipeline-status-panel">
        <div class="panel-grid">
            <div class="form-group"><label>Stream Key</label><input type="password" id="apiKey"></div>
            <div class="form-group"><label>Credits</label><input type="number" id="creditInput" value="1000"></div>
            <div class="form-group hide-on-mobile-tablet"><label>Camera</label><select id="cameraSelect"><option>Detecting...</option></select></div>
            <div class="form-group-actions"><button id="btnConnect" class="btn-initialize">Start</button><button id="btnStop" class="btn-shutdown">Stop</button></div>
        </div>
    </div>

    <div class="grid" style="display:flex; gap:24px;">
        <div class="box" style="width:50%;">
            <h3>Input</h3>
            <div class="video-container"><video id="localVideo" autoplay muted playsinline></video></div>
        </div>
        <div class="box" style="width:50%;">
            <h3>Output</h3>
            <button class="fullscreen-trigger" id="launchFullscreen">⛶ Fullscreen</button>
            <div class="video-container"><video id="remoteVideo" autoplay playsinline></video></div>
        </div>
    </div>

    <div id="hudOverlay" class="hud-fullscreen-overlay">
        <div class="hud-layout">
            <div class="hud-main-output"><video id="hudRemoteVideo" autoplay playsinline></video></div>
            <div class="hud-watermark-timer">
                <span class="hud-watermark-label">Time</span>
                <span class="hud-watermark-value" id="hudSessionCountdown">0:00</span>
            </div>
            <div class="hud-floating-actions">
                <button id="hudBtnStop" class="hud-btn-action hud-btn-stop-floating">Stop</button>
                <button id="hudExitBtn" class="hud-btn-action hud-btn-close">✕ Close</button>
            </div>
        </div>
    </div>
</body>
</html>
