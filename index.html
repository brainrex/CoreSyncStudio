<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CoreSync Studio v2.2.6 by BrainRex</title>
    <style>
        /* Modern UI Design Tokens */
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --border-color: #334155;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --transition: all 0.2s ease;
        }

        body { 
            font-family: var(--font-family); 
            background: var(--bg-base); 
            color: var(--text-primary); 
            padding: 20px 30px; 
            margin: 0; 
            box-sizing: border-box;
            min-height: 100vh;
            transition: var(--transition);
        }
        
        .studio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .studio-title h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .version-badge {
            background: var(--accent-primary);
            color: #fff;
            padding: 4px 8px;
            font-weight: 600;
            font-size: 12px;
            border-radius: 6px;
        }

        .header-controls {
            font-size: 13px;
        }

        .pipeline-status-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .panel-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 180px;
        }

        .form-group-thumb {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
        }

        .form-group-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: flex-end;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 10px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input[type="text"], input[type="password"], input[type="file"], input[type="number"], select { 
            background: var(--bg-base); 
            color: var(--text-primary); 
            border: 1px solid var(--border-color); 
            padding: 8px 12px; 
            box-sizing: border-box; 
            font-family: var(--font-family);
            border-radius: var(--radius-md);
            font-size: 13px;
            height: 38px;
            transition: var(--transition);
        }

        input:focus, select:focus { 
            border-color: var(--accent-primary); 
            outline: none; 
        }

        button { 
            font-family: var(--font-family);
            padding: 0 20px; 
            height: 38px;
            font-weight: 600; 
            cursor: pointer; 
            border: none; 
            border-radius: var(--radius-md);
            font-size: 13px;
            transition: var(--transition);
        }

        .btn-initialize { background: var(--accent-primary); color: #ffffff; }
        .btn-shutdown { background: var(--danger); color: #ffffff; }

        button:disabled {
            background: var(--bg-surface-hover) !important;
            color: var(--text-secondary) !important;
            cursor: not-allowed !important;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
        }
        .status-pill.idle { color: var(--text-secondary); }
        .status-pill.live { color: var(--danger); }

        .asset-preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            width: 38px;
            height: 38px;
            overflow: hidden;
        }
        .impact-thumbnail { width: 100%; height: 100%; object-fit: cover; display: none; }
        .thumbnail-placeholder { font-size: 10px; color: var(--text-secondary); font-weight: 500; }

        .grid { display: flex; gap: 24px; margin-bottom: 24px; }
        .box { 
            background: var(--bg-surface); 
            padding: 16px; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-color); 
            width: 50%; 
            position: relative;
            box-shadow: var(--shadow-md);
        }
        .box h3 { margin: 0 0 12px 0; font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: var(--radius-md);
            width: 100%;
            aspect-ratio: 16/9; 
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .fullscreen-trigger {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 12px;
            height: auto;
            font-size: 11px;
            border-radius: 20px;
            z-index: 10;
        }

        .collapsible-console-wrapper {
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .console-header {
            background: var(--bg-surface);
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .console-content { display: none; padding: 16px; background: var(--bg-base); }
        .console { height: 140px; overflow-y: auto; font-size: 12px; font-family: ui-monospace, monospace; color: var(--text-secondary); }

        .hud-fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 99999;
        }
        .hud-layout { position: relative; width: 100%; height: 100%; }
        .hud-main-output { width: 100%; height: 100%; background: #000; }
        .hud-main-output video { width: 100%; height: 100%; object-fit: cover; }

        .hud-watermark-timer {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 24px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100000;
        }
        .hud-watermark-label { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        .hud-watermark-value { font-size: 18px; font-weight: 700; color: #ffffff; font-family: ui-monospace, monospace; }

        .hud-floating-actions {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom));
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 100000;
        }
        .hud-btn-action { height: 40px; padding: 0 20px; border-radius: 20px; font-weight: 700; font-size: 13px; }
        .hud-btn-close { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
        .hud-btn-stop-floating { background: var(--danger); color: #ffffff; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .studio-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .header-controls { text-align: left; width: 100%; display: flex; justify-content: space-between; }
            .panel-grid { flex-direction: column; align-items: stretch; }
            .form-group.hide-on-mobile { display: none !important; }
            .form-group { min-width: 100%; }
            .grid { flex-direction: column; gap: 16px; }
            .box { width: 100%; }
            .video-container { aspect-ratio: 11/14; }
        }
    </style>
    
    <script type="module">
        let sdkModuleLoaded = false;
        let createDecartClient, models;
        let client;
        let realtimeClient = null;
        let localStream = null;
        
        let countdownInterval = null;
        let currentTimeRemaining = 0; 
        const BURN_RATE = 2; 

        async function initApp() {
            filteriOSHardwareControls();

            try {
                const sdk = await import("https://esm.sh/@decartai/sdk");
                createDecartClient = sdk.createDecartClient;
                models = sdk.models;
                sdkModuleLoaded = true;
                console.log("[OK] Decart Core Module Framework compiled safely.");
            } catch (sdkError) {
                logToConsole("❌ SDK Error: Unable to fetch cloud stream wrappers.", true);
            }

            fetchHardware();
            calculateInitialTime();
            assessKeyStatus();
        }

        function filteriOSHardwareControls() {
            const isAppleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isAppleMobile) {
                const hwGroup = document.getElementById('hardwareSelectorGroup');
                const qGroup = document.getElementById('qualitySelectorGroup');
                if (hwGroup) hwGroup.style.setProperty('display', 'none', 'important');
                if (qGroup) qGroup.style.setProperty('display', 'none', 'important');
                console.log("[IOS DETECTED] Hidden camera and quality hardware modules configuration components safely.");
            }
        }

        async function fetchHardware() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSelect = document.getElementById('cameraSelect');
                if (!camSelect) return;
                camSelect.innerHTML = '';
                
                let count = 1;
                devices.forEach(device => {
                    if (device.kind === 'videoinput') {
                        const opt = document.createElement('option');
                        opt.value = device.deviceId;
                        opt.text = device.label || `Camera ${count++}`;
                        camSelect.appendChild(opt);
                    }
                });
            } catch (err) {
                console.log("Hardware enumeration skipped.");
            }
        }

        function logToConsole(text, isError = false) {
            const consoleEl = document.getElementById('sysConsole');
            if(!consoleEl) return;
            const timestamp = new Date().toLocaleTimeString();
            let colorVar = isError ? "var(--danger)" : "var(--accent-primary)";
            consoleEl.innerHTML += `<div style="color: ${colorVar}; margin-bottom: 4px;">[${timestamp}] ${text}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function calculateInitialTime() {
            const creditInput = document.getElementById('creditInput');
            const credits = creditInput ? parseInt(creditInput.value) : 0;
            
            if (!isNaN(credits) && credits > 0) {
                currentTimeRemaining = Math.max(0, Math.floor(credits / BURN_RATE));
            } else {
                currentTimeRemaining = 0;
            }
            updateCountdownUI();
        }

        function initCountdownEngine() {
            clearInterval(countdownInterval);
            calculateInitialTime();

            countdownInterval = setInterval(() => {
                if (currentTimeRemaining <= 0) {
                    logToConsole("⚠️ Credits exhausted. Hard stop engaged.", true);
                    stopStream(); 
                    return;
                }
                currentTimeRemaining--;
                updateCountdownUI();
            }, 1000);
        }

        function updateCountdownUI() {
            const minutes = Math.floor(currentTimeRemaining / 60);
            const seconds = currentTimeRemaining % 60;
            const formatStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            const sessionCountdown = document.getElementById('sessionCountdown');
            const hudSessionCountdown = document.getElementById('hudSessionCountdown');
            
            if (sessionCountdown) sessionCountdown.innerText = formatStr;
            if (hudSessionCountdown) hudSessionCountdown.innerText = formatStr;
        }

        function assessKeyStatus() {
            const keyInput = document.getElementById('apiKey');
            const rawKey = keyInput ? keyInput.value.trim() : '';
            const fileInput = document.getElementById('photoUpload')?.files[0];
            const startBtn = document.getElementById('btnConnect');
            const fullscreenBtn = document.getElementById('launchFullscreen');

            if (realtimeClient) {
                if (startBtn) startBtn.disabled = true;
                if (fullscreenBtn) fullscreenBtn.disabled = false;
            } else {
                if (fullscreenBtn) fullscreenBtn.disabled = true;
                if (startBtn) startBtn.disabled = !(sdkModuleLoaded && rawKey.length > 0 && fileInput);
            }
        }

        async function startStream() {
            if (realtimeClient) {
                await realtimeClient.disconnect().catch(() => {});
                realtimeClient = null;
            }

            const rawKey = document.getElementById('apiKey')?.value.trim();
            const fileInput = document.getElementById('photoUpload')?.files[0];
            const camId = document.getElementById('cameraSelect')?.value || '';
            
            if (!rawKey || !fileInput) return;

            logToConsole(`Compiling session assets...`);
            document.getElementById('btnConnect').disabled = true;
            document.getElementById('btnStop').disabled = false;
            document.getElementById('hudBtnStop').disabled = false;

            try {
                client = createDecartClient({ apiKey: rawKey, baseUrl: "wss://api3.decart.ai" });
                const model = models.realtime("lucy-latest");

                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: camId ? { exact: camId } : undefined, width: 1280, height: 720 },
                        audio: false
                    });
                    document.getElementById('localVideo').srcObject = localStream;
                }

                const reader = new FileReader();
                reader.readAsArrayBuffer(fileInput);
                reader.onloadend = async () => {
                    const imageBlob = new Blob([reader.result], { type: fileInput.type });
                    
                    try {
                        realtimeClient = await client.realtime.connect(localStream, {
                            model: model,
                            initialState: { prompt: { text: "Transform into this character" }, image: imageBlob },
                            onRemoteStream: (transformedStream) => {
                                logToConsole("Pipeline loop linked! Streaming output...");
                                document.getElementById('remoteVideo').srcObject = transformedStream;
                                document.getElementById('hudRemoteVideo').srcObject = transformedStream;
                                
                                const systemPill = document.getElementById('systemPill');
                                if (systemPill) { systemPill.className = "status-pill live"; systemPill.innerText = "LIVE"; }
                                
                                initCountdownEngine();
                                assessKeyStatus();
                            },
                            onError: (err) => {
                                if (err && err.message) {
                                    logToConsole(`❌ Pipeline Context Exception: ${err.message}`, true);
                                }
                                stopStream();
                            }
                        });
                    } catch (connErr) {
                        logToConsole(`Stream handshake initialization pending or blocked: ${connErr.message}`, true);
                        stopStream();
                    }
                };
            } catch (error) {
                logToConsole(`Initialization Failed: ${error.message}`, true);
                stopStream();
            }
        }

        async function stopStream() {
            clearInterval(countdownInterval);
            countdownInterval = null;
            
            if (realtimeClient) {
                await realtimeClient.disconnect().catch(() => {});
                realtimeClient = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('hudRemoteVideo').srcObject = null;

            const systemPill = document.getElementById('systemPill');
            if (systemPill) { systemPill.className = "status-pill idle"; systemPill.innerText = "IDLE"; }

            // Ensure stop elements flip back smoothly on layout trees
            document.getElementById('btnStop').disabled = true;
            document.getElementById('hudBtnStop').disabled = true;
            
            assessKeyStatus();
            logToConsole("Operational interfaces idling. Output monitors completely blanked out.");
        }

        function triggerHUDMode(activate) {
            const overlay = document.getElementById('hudOverlay');
            if (!overlay) return;
            if (activate) {
                overlay.style.display = "block";
                if (overlay.requestFullscreen) overlay.requestFullscreen().catch(() => {});
            } else {
                overlay.style.display = "none";
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnConnect')?.addEventListener('click', startStream);
            document.getElementById('btnStop')?.addEventListener('click', stopStream);
            document.getElementById('hudBtnStop')?.addEventListener('click', stopStream);
            
            document.getElementById('apiKey')?.addEventListener('input', assessKeyStatus);
            document.getElementById('creditInput')?.addEventListener('input', () => {
                calculateInitialTime();
                assessKeyStatus();
            });
            document.getElementById('photoUpload')?.addEventListener('change', handleImageSync);
            
            document.getElementById('consoleHeader')?.addEventListener('click', () => {
                const content = document.getElementById('consoleContent');
                content.style.display = content.style.display === "block" ? "none" : "block";
            });

            document.getElementById('launchFullscreen')?.addEventListener('click', () => triggerHUDMode(true));
            document.getElementById('hudExitBtn')?.addEventListener('click', () => triggerHUDMode(false));
            
            function handleImageSync(event) {
                const file = event.target.files[0];
                const mainThumb = document.getElementById('mainThumb');
                const placeholderText = document.getElementById('thumbPlaceholder');

                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        if (mainThumb) { mainThumb.src = e.target.result; mainThumb.style.display = 'block'; }
                        if (placeholderText) placeholderText.style.display = 'none';
                        assessKeyStatus();
                    };
                    reader.readAsDataURL(file);
                }
            }
            initApp();
        });
    </script>
</head>
<body>

    <header class="studio-header">
        <div class="studio-title">
            <h2>CoreSync Studio by Brain Moth3rfucking Rex <span class="version-badge">v2.2.6</span></h2>
        </div>
        <div class="header-controls">
            <div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="status-pill idle" id="systemPill">IDLE</span>
                    <span style="color:var(--text-secondary); font-weight: 500;">
                        Session Limit: <span id="sessionCountdown" style="color:var(--text-primary); font-family: ui-monospace, monospace;">0:00</span>
                    </span>
                </div>
            </div>
        </div>
    </header>
    
    <div class="pipeline-status-panel">
        <div class="panel-grid">
            <div class="form-group">
                <label>Stream Key</label>
                <input type="password" id="apiKey" placeholder="Enter Stream Key (dct_...)">
            </div>
            <div class="form-group">
                <label>Credits (Max 1000)</label>
                <input type="number" id="creditInput" placeholder="1000" min="0" max="1000" value="1000">
            </div>
            <div class="form-group hide-on-mobile" id="hardwareSelectorGroup">
                <label>Camera Hardware</label>
                <select id="cameraSelect">
                    <option value="">Detecting...</option>
                </select>
            </div>
            <div class="form-group hide-on-mobile" id="qualitySelectorGroup">
                <label>Stream Quality</label>
                <select id="resSelect">
                    <option value="1280x720">720p (High)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Reference Asset</label>
                <input type="file" id="photoUpload" accept="image/*">
            </div>
            <div class="form-group-thumb">
                <label>Thumbnail</label>
                <div class="asset-preview-box">
                    <img id="mainThumb" class="impact-thumbnail" alt="Reference View">
                    <span id="thumbPlaceholder" class="thumbnail-placeholder">NONE</span>
                </div>
            </div>
            <div class="form-group-actions">
                <button id="btnConnect" class="btn-initialize" disabled>Start Session</button>
                <button id="btnStop" class="btn-shutdown" disabled>Stop</button>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="box">
            <h3>Input Camera</h3>
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
        </div>
        <div class="box">
            <h3>Live Output</h3>
            <button class="fullscreen-trigger" id="launchFullscreen" disabled>⛶ Fullscreen</button>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <div class="collapsible-console-wrapper">
        <div class="console-header" id="consoleHeader">
            <span style="font-weight: 600;">System Logs</span>
            <span style="font-size: 12px; color:var(--text-secondary);">Toggle Output</span>
        </div>
        <div class="console-content" id="consoleContent">
            <div class="console" id="sysConsole">CoreSync system diagnostics initialized...</div>
        </div>
    </div>

    <div id="hudOverlay" class="hud-fullscreen-overlay">
        <div class="hud-layout">
            <div class="hud-main-output">
                <video id="hudRemoteVideo" autoplay playsinline></video>
            </div>
            
            <div class="hud-watermark-timer">
                <span class="hud-watermark-label">Time Remaining</span>
                <span class="hud-watermark-value" id="hudSessionCountdown">0:00</span>
            </div>

            <div class="hud-floating-actions">
                <button id="hudBtnStop" class="hud-btn-action hud-btn-stop-floating" disabled>Stop Stream</button>
                <button id="hudExitBtn" class="hud-btn-action hud-btn-close">✕ Close HUD</button>
            </div>
        </div>
    </div>

</body>
</html>
