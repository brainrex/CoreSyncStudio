<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreSync Studio v1.3</title>
    <style>
        :root { --bg-base: #0f172a; --bg-surface: #1e293b; --bg-surface-hover: #334155; --text-primary: #f8fafc; --text-secondary: #94a3b8; --accent-primary: #38bdf8; --accent-hover: #0ea5e9; --danger: #ef4444; --success: #10b981; --border-color: #334155; --radius-md: 8px; --radius-lg: 12px; }
        body { font-family: system-ui, sans-serif; background: var(--bg-base); color: var(--text-primary); padding: 20px; margin: 0; }
        .pipeline-status-panel { background: var(--bg-surface); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .panel-row-horizontal { display: flex; gap: 15px; align-items: flex-end; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; }
        input, select { background: #0f172a; border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 6px; }
        button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .btn-initialize { background: var(--accent-primary); }
        .btn-shutdown { background: var(--danger); }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .video-container { background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; margin-top: 10px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .hud-fullscreen-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
    </style>
    <script type="module">
        import { createDecartClient, models } from "https://esm.sh/@decartai/sdk";
        let realtimeClient, localStream, countdownInterval;
        const BURN_RATE = 2; // Credits per second

        async function refreshDevices() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const camSelect = document.getElementById('cameraSelect');
            devices.filter(d => d.kind === 'videoinput').forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `Camera ${camSelect.length + 1}`;
                camSelect.appendChild(opt);
            });
        }

        function updateCountdownUI(secs) {
            const time = `${Math.floor(secs/60)}:${(secs%60).toString().padStart(2, '0')}`;
            document.getElementById('sessionCountdown').innerText = time;
            document.getElementById('hudSessionCountdown').innerText = time;
        }

        async function startStream() {
            const credits = parseInt(document.getElementById('creditInput').value);
            if (credits <= 0) { alert("Out of credits!"); return; }
            
            const constraints = {
                video: {
                    deviceId: { exact: document.getElementById('cameraSelect').value },
                    width: { ideal: parseInt(document.getElementById('resSelect').value.split('x')[0]) },
                    height: { ideal: parseInt(document.getElementById('resSelect').value.split('x')[1]) }
                }
            };

            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            let remaining = credits / BURN_RATE;
            
            // UI setup
            document.getElementById('btnConnect').disabled = true;
            document.getElementById('localVideo').srcObject = localStream;
            
            countdownInterval = setInterval(() => {
                remaining--;
                updateCountdownUI(remaining);
                if (remaining <= 0) stopStream();
            }, 1000);

            // API logic would proceed here...
        }

        function stopStream() {
            clearInterval(countdownInterval);
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.querySelectorAll('video').forEach(v => v.srcObject = null);
            document.getElementById('btnConnect').disabled = false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshDevices();
            document.getElementById('btnConnect').addEventListener('click', startStream);
            document.getElementById('btnStop').addEventListener('click', stopStream);
        });
    </script>
</head>
<body>
    <div class="pipeline-status-panel">
        <div class="panel-row-horizontal">
            <div class="form-group"><label>Key</label><input type="password" id="apiKey"></div>
            <div class="form-group"><label>Credits</label><input type="number" id="creditInput" value="1000"></div>
            <div class="form-group"><label>Camera</label><select id="cameraSelect"></select></div>
            <div class="form-group"><label>Quality</label><select id="resSelect">
                <option value="1280x720">720p</option>
                <option value="854x480">480p</option>
            </select></div>
            <button id="btnConnect" class="btn-initialize">Start</button>
            <button id="btnStop" class="btn-shutdown">Stop</button>
        </div>
    </div>
    <div class="grid">
        <div class="box"><h3>Input</h3><div class="video-container"><video id="localVideo" autoplay muted></video></div></div>
        <div class="box"><h3>Output</h3><div class="video-container"><video id="remoteVideo" autoplay></video></div></div>
    </div>
</body>
</html>
